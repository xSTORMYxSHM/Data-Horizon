name: Feature request
description: Suggest a focused visualizer or broadcast-authoring improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Authoring problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the workflow and visible result rather than only a UI control.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Primary target
      options:
        - Data Horizon Studio
        - Quartic Pulse
        - Tempest Broadcast or Asset Vault
        - OBS or shared runtime
        - Project format or interoperability
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References or examples
      description: Link only to material you are permitted to share.
