name: Bug report
description: Report reproducible incorrect behavior in Data Horizon Studio.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private projects, copyrighted media, stream keys, tokens, or sensitive Asset Vault content.
  - type: input
    id: version
    attributes:
      label: Data Horizon version
      placeholder: 0.20.5
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Other or development environment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use a minimal project or describe how to create one from scratch.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Non-sensitive diagnostics
      description: Include renderer errors or screenshots only after removing private information.
