name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          version: '11.19.0'
          runtime: 'node@22.12.0'
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
